services:
  postgres:
    image: postgres:16
    container_name: trailink-postgres
    environment:
      POSTGRES_DB: trailink
      POSTGRES_USER: trailink
      POSTGRES_PASSWORD: trailink
    ports:
      - "5432:5432"
    volumes:
      - trailink-postgres-data:/var/lib/postgresql/data

volumes:
  trailink-postgres-data:
